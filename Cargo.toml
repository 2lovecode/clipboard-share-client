[package]
name = "clipboard-share-client"
version = "0.1.0"
authors = ["2lovecode <liu546hao@163.com>"]
edition = "2018"
resolver = "2"

[dependencies]
iced = { version = "0.6", features = ["tokio", "debug"] }
iced_native = { version = "0.7" }
iced_futures = { version = "0.5" }
once_cell = "1.15"
async-tungstenite = { version = "0.16", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
warp = { version = "0.3" }
cli-clipboard = { version = "0.4.0" }
chrono = { version = "0.4.23", features = ["clock"] }
iced_graphics = { version = "0.5.0", features = ["font-source"] }
tauri-hotkey = "0.1.2"
project-root = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.21"
mdns-sd = "0.11"
subtle = "2"
