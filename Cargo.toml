[package]
name = "clipboard-share-client"
version = "0.1.0"
authors = ["2lovecode <liu546hao@163.com>"]
edition = "2018"
resolver="2"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
iced = {version="0.6", features = ["tokio", "debug"]}
iced_native = { version="0.7" }
iced_futures = { version="0.5" }
once_cell = "1.15"
tokio = {version="1", features = ["full"]}
chrono = {version="0.4.23"}
iced_graphics = {version="0.5.0", features = [ "font-source" ]}
tauri-hotkey = "0.1.2"
project-root = "0.2.2"

# P2P 加密通道
snow = "0.9"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
bytes = "1.4"
tokio-util = { version = "0.7", features = ["codec"] }

# 剪切板：文字+图片，监听
arboard = "3.3"
base64 = "0.21"

# 本地历史存储
dirs = "5.0"
serde_json = "1"