[package]
name = "clipboard-share-client"
version = "0.1.0"
authors = ["2lovecode <liu546hao@163.com>"]
edition = "2018"
resolver="2"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
egui = "0.29"
eframe = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
once_cell = "1.15"
tokio = {version="1.43", features = ["full"]}
chrono = {version="0.4.23"}
tauri-hotkey = "0.1.2"
project-root = "0.2.2"

# P2P 加密通道
snow = "0.9"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
bytes = "1.4"
tokio-util = { version = "0.7", features = ["codec"] }
hex = "0.4"
rand = "0.8"

# 剪切板：文字+图片，监听
arboard = "3.3"
base64 = "0.21"

# 本地历史存储
dirs = "5.0"
serde_json = "1"
rusqlite = { version = "0.29", features = ["bundled"] }

# 系统集成
notify-rust = "4"
core-graphics = "0.24"