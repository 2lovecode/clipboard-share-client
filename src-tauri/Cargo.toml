[package]
name = "clipboard-share-client"
version = "0.1.0"
description = "跨平台剪贴板共享客户端"
authors = ["2lovecode <liu546hao@163.com>"]
edition = "2021"

[lib]
name = "clipboard_share_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43", features = ["full"] }
chrono = "0.4"
snow = "0.9"
bincode = "1.3"
bytes = "1.4"
hex = "0.4"
rand = "0.8"
arboard = "3.3"
base64 = "0.21"
dirs = "5.0"
rusqlite = { version = "0.29", features = ["bundled"] }
notify-rust = "4"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
